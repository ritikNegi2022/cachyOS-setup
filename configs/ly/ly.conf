# Ly display manager configuration
# Minimal — no theme, no extras, just login → dwm

[ly]
theme = ""
background = ""
daemonize = true

# Show a simple login screen
show-all = false

# Disable unnecessary features for minimal setup
disable-power-key = true
disable-sleep-key = true

[users]
# Add users here if you want them shown by default
# Empty = all users on system are shown
