# Ly display manager config — ly 1.4.x (INI format, installed to /etc/ly/config.ini)
# Minimal — no animations, no extras, just login → dwm
# Full option reference: /etc/ly/config.ini.example (shipped by the `ly` package)

# Hide the plain "shell" session from the session list (dwm comes from /usr/share/xsessions/)
shell = false

# Remember the last used desktop + login between sessions
save = true

# Run before every X session: source the user profile so dwm/xdg get the right env.
# NOTE: the command must end with `exec "$@"` — that is what launches the session.
login_cmd = /etc/ly/login.sh

# Sessions are discovered from /usr/share/xsessions/ (package default, left as-is).
# dwm session file: configs/ly/dwm.desktop → /usr/share/xsessions/dwm.desktop
