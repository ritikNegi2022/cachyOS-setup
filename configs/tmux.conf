# Minimal tmux — vim-style, Ctrl+Space prefix, monochrome, no plugins.
# Faster workflow: prefix-less pane/window jumps, cwd-aware splits/windows,
# session create-or-attach, clipboard copy, hideable status bar.

# --- prefix ---
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# --- terminal: truecolor (nvim/helix themes), instant ESC, focus events ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,alacritty:RGB"
set -g focus-events on
set -sg escape-time 0
set -g set-clipboard on

# --- windows: 1-based, auto-renumber, names show current dir ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g detach-on-destroy off

# --- mouse + scrollback ---
set -g mouse on
set -g history-limit 50000

# --- splits (keep cwd) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- panes: prefix + hjkl, repeat-resize with HJKL ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- no-prefix jumps (fastest workflow): Alt+hjkl panes, Shift+arrows windows ---
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n S-Left previous-window
bind -n S-Right next-window

# --- windows/sessions (keep cwd), create-or-attach named session ---
bind c new-window -c "#{pane_current_path}"
bind S command-prompt -p "session:" "new-session -A -s '%%'"
bind s choose-tree -sZ -O name

# --- reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- status bar: single monochrome line, toggle with prefix+b ---
set -g status on
set -g status-style bg=colour232,fg=colour250
set -g status-left "#[fg=colour255,bold]#S "
set -g status-right "#[fg=colour250]%H:%M "
set -g status-interval 15
set -g status-justify left
set -g window-status-format "#[fg=colour244] #I:#W "
set -g window-status-current-format "#[fg=colour255,bold] #I:#W "
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour255
bind b set status

# --- copy mode: vi keys, y yanks to system clipboard ---
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
