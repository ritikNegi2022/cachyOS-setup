# Alacritty config — validated against alacritty 0.17 schema
# https://alacritty.org/config-alacritty.html

[general]
import = []

[window]
padding = { x = 8, y = 8 }
decorations = "Full"        # values: "Full" | "None" | "Transparent" | "Buttonless"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 8.0

# Pure black, fully opaque — no compositor needed
[colors.primary]
background = "#000000"
foreground = "#eeeeee"

# NOTE: [keyboard] is the correct table (pre-0.13 used [keys])
[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  # Super (Mod4) copy/paste — terminal-safe: never sends SIGINT (Ctrl+C)
  { key = "V", mods = "Super",         action = "Paste" },
  { key = "C", mods = "Super",         action = "Copy" },
  { key = "X", mods = "Super",         action = "Copy" },
  { key = "Insert", mods = "Super",    action = "Paste" },
]

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
