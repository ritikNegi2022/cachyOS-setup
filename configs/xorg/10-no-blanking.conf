# Disable automatic screen blanking + DPMS power-off — screen never sleeps
# Installed to /etc/X11/xorg.conf.d/10-no-blanking.conf by scripts/dwm-config.sh
# (and scripts/apply-privileged.sh). Takes effect on next X start.
# Live per-session enforcement happens in configs/ly/dwm-session via:
#   xset s off -dpms; xset s noblank
#
# Without this, Xorg defaults blank the screen after ~10 min idle
# (screensaver BlankTime + DPMS standby/suspend/off). No locker is involved —
# the display just goes dark until input. This config zeroes all timeouts
# and turns DPMS off entirely, so only manual lock (Super+Shift+X / power
# button -> screen-lock) ever blanks the screen.

Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Monitor"
    Identifier "no-dpms"
    Option "DPMS" "false"
EndSection
