# Natural (inverted) scrolling — touchpad + mouse wheel
# Installed to /etc/X11/xorg.conf.d/30-natural-scroll.conf by scripts/dwm-config.sh
# Applies to libinput devices (Arch/CachyOS default).

Section "InputClass"
    Identifier "natural scroll touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "NaturalScrolling" "true"
EndSection

Section "InputClass"
    Identifier "natural scroll pointer"
    MatchIsPointer "on"
    Driver "libinput"
    Option "NaturalScrolling" "true"
EndSection

Section "InputClass"
    Identifier "natural scroll mouse wheel"
    MatchIsTouchpad "off"
    MatchIsPointer "on"
    Driver "libinput"
    Option "NaturalScrolling" "true"
EndSection
