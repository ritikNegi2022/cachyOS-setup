<touchégg>
  <application name="All">

    <!-- 3-finger swipe up → zoom window to master (now Super+Ctrl+Return) -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+ctrl+Return</command>
      </action>
    </gesture>

    <!-- 3-finger swipe down → close window (dwm killclient: Super+Shift+c) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+shift+c</command>
      </action>
    </gesture>

    <!-- 3-finger swipe left/right → switch tags (tag-1 / tag+1) via shiftview -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+ctrl+Left</command>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+ctrl+Right</command>
      </action>
    </gesture>

  </application>
</touchégg>
