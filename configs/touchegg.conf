<touchégg>
  <settings>
    <!-- touchegg reads element text (<property>VALUE</property>), NOT a
         value="..." attribute. Using value="..." leaves the setting empty
         and crashes v2.0.18: "Bad action_execute_threshold value: stoi"
         followed by abort (stoull on animation_delay). -->
    <!-- Fire RUN_COMMAND the moment a swipe starts instead of waiting for the
         gesture to finish: short/quick swipes trigger every time instead of
         being swallowed when the finger lifts early.
         threshold 0 = execute unconditionally; <on>begin</on> below makes the
         begin-execution explicit on touchegg >= 2.0.18. -->
    <property name="animation_delay">0</property>
    <property name="action_execute_threshold">0</property>
  </settings>
  <application name="All">

    <!-- No UP/DOWN gestures on purpose (unused) -->
    <!-- 3-finger swipe left → NEXT tag (inverted: swipe left, go right) -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+ctrl+Right</command>
        <on>begin</on>
      </action>
    </gesture>
    <!-- 3-finger swipe right → PREV tag (inverted: swipe right, go left) -->
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+ctrl+Left</command>
        <on>begin</on>
      </action>
    </gesture>

  </application>
</touchégg>
