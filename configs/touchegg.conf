<touchégg>
  <application name="All">

    <!-- 3-finger swipe up → zoom window to master (dwm: Super+Return) -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+Return</command>
      </action>
    </gesture>

    <!-- 3-finger swipe down → close window (dwm killclient: Super+Shift+c) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xdotool key super+shift+c</command>
      </action>
    </gesture>

    <!-- 3-finger swipe left/right → resize master area (dwm setmfact: Super+h / Super+l) -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>xdotool key super+h</command>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>true</repeat>
        <command>xdotool key super+l</command>
      </action>
    </gesture>

  </application>
</touchégg>
